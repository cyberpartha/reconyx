[build-system]
requires      = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name            = "reconyx"
version         = "2.0.4"
description     = "Advanced Bug Bounty Reconnaissance Framework"
authors         = [{name = "CyberPartha"}]
license         = {text = "MIT"}
readme          = "README.md"
requires-python = ">=3.11"
keywords        = [
    "bug-bounty", "reconnaissance", "security", "subdomain-enumeration",
    "pentest", "osint", "hacking", "cybersecurity",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Internet",
]
dependencies = [
    "aiohttp>=3.9.0",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
]

[project.scripts]
reconyx = "reconyx.cli:main"

[project.urls]
Homepage   = "https://github.com/CyberPartha/reconyx"
Repository = "https://github.com/CyberPartha/reconyx"
Issues     = "https://github.com/CyberPartha/reconyx/issues"

[tool.setuptools.packages.find]
where = ["."]

[tool.pytest.ini_options]
testpaths      = ["tests"]
asyncio_mode   = "auto"
addopts        = "-v --tb=short"

[tool.coverage.run]
source = ["reconyx"]
omit   = ["tests/*", "reconyx.py"]
